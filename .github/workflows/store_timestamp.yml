name: Store PR Creation Timestamp

on:
  pull_request:
    types: [opened]

jobs:
  save-timestamp:
    runs-on: ubuntu-latest

    steps:
      - name: Get PR creation timestamp
        id: timestamp
        run: |
          # Crear el archivo timestamp.txt en el directorio de trabajo actual
          echo "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" > timestamp.txt
          # Verificamos que se creó
          ls -la timestamp.txt
          cat timestamp.txt

      - name: Save timestamp as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: pr-${{ github.event.pull_request.number }}-timestamp
          path: timestamp.txt

      - name: Write timestamp to file
        run: |
          echo "${{ steps.timestamp.outputs.timestamp }}" > timestamp.txt
